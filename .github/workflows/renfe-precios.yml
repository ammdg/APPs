name: Precios Renfe

on:
  schedule:
    - cron: "7 * * * *" # cada hora (minuto 7, para evitar el pico de las en punto)
  workflow_dispatch:

concurrency:
  group: renfe-precios
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: renfe-precios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: renfe-precios/requirements.txt

      - run: pip install -r requirements.txt

      # Recupera qué trenes ya se avisaron para no repetir el aviso cada hora.
      - uses: actions/cache/restore@v4
        with:
          path: renfe-precios/estado.json
          key: renfe-estado-${{ github.run_id }}
          restore-keys: renfe-estado-

      - name: Comprobar precios
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python renfe_precios.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: renfe-precios/estado.json
          key: renfe-estado-${{ github.run_id }}
