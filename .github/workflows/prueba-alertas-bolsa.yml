name: Backtest alertas de bolsa (temporal)

# Temporal: backtest de las señales BUY. Se borra tras la prueba.
on:
  push:
    branches: [claude/stock-market-alerts-ex6jzw]
    paths: [.github/workflows/prueba-alertas-bolsa.yml]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: alertas-bolsa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alertas-bolsa/requirements.txt
      - run: pip install -r requirements.txt
      - run: python backtest.py --desde 2026-09-01 --hasta 2026-09-12 --fin 2026-09-25 --anual-desde 2025-09-26
