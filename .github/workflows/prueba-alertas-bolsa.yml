name: Trayectoria BUY alertas de bolsa (temporal)

# Temporal: qué hace la acción en las 30 sesiones siguientes a cada BUY. Se borra tras la prueba.
on:
  push:
    branches: [claude/stock-market-alerts-ex6jzw]
    paths: [.github/workflows/prueba-alertas-bolsa.yml]

jobs:
  trayectoria:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: alertas-bolsa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alertas-bolsa/requirements.txt
      - run: pip install -r requirements.txt
      - run: python trayectoria.py --fin 2026-09-25 --corte 2025-01-01
