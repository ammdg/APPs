name: Notas de un instrumento

# Procesa las canciones para https://ammdg.github.io/APPs/notas-instrumento/web/
#  - Al subir audios a notas-instrumento/canciones/ en main (se borran al terminar).
#  - A mano (Run workflow) con un enlace de descarga: la canción no pasa por el repositorio.
#  - Al borrar a mano una carpeta de notas-instrumento/web/canciones/: rehace la lista.
on:
  push:
    branches: [main]
    paths:
      - "notas-instrumento/canciones/**"
      - "notas-instrumento/web/canciones/**"
  workflow_dispatch:
    inputs:
      url:
        description: "Enlace de descarga del audio (vacío = procesar la carpeta canciones/)"
        required: false
      titulo:
        description: "Título de la canción (obligatorio si pones un enlace)"
        required: false

concurrency:
  group: notas-instrumento
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # guardar las canciones procesadas en main
      pages: write # pedir que se publique Pages
    defaults:
      run:
        working-directory: notas-instrumento
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para poder hacer rebase al guardar

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Basic Pitch necesita TensorFlow 2.15, que no instala en 3.12+
          cache: pip
          cache-dependency-path: notas-instrumento/requirements.txt

      - name: Instalar dependencias
        run: |
          # ffmpeg solo hace falta para leer M4A/AAC.
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          # PyTorch de CPU (el normal trae CUDA y pesa varios GB; aquí no hay tarjeta gráfica).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # El modelo de separación (~80 MB) se descarga una vez y se guarda entre ejecuciones.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: demucs-htdemucs_6s

      - name: Procesar canciones
        env:
          URL: ${{ inputs.url }}
          TITULO: ${{ inputs.titulo }}
        run: |
          if [ -n "$URL" ]; then
            python publica.py --url "$URL" --titulo "$TITULO"
          else
            python publica.py
          fi

      # Se guarda aunque alguna canción falle, para no perder las que sí salieron.
      - name: Publicar
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A canciones web
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Notas de un instrumento: canciones procesadas"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((intento * 5))
          done
          # Los push hechos con el token de Actions no siempre lanzan la publicación de Pages: se pide a mano.
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
