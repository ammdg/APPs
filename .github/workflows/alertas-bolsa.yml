name: Alertas de bolsa

on:
  schedule:
    # Lunes a viernes a las 21:37 UTC: después del cierre de Nueva York todo el año
    # (16:00 hora de NY = 20:00 UTC en verano, 21:00 UTC en invierno).
    - cron: "37 21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: alertas-bolsa
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: alertas-bolsa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alertas-bolsa/requirements.txt

      - run: pip install -r requirements.txt

      # Recupera qué alertas ya se enviaron (para no repetirlas con la misma vela) y la última lista
      # de las 500 mayores (por si nasdaq.com falla).
      - uses: actions/cache/restore@v4
        with:
          path: |
            alertas-bolsa/estado.json
            alertas-bolsa/universo.json
          key: bolsa-estado-${{ github.run_id }}
          restore-keys: bolsa-estado-

      - name: Comprobar indicadores
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alertas_bolsa.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            alertas-bolsa/estado.json
            alertas-bolsa/universo.json
          key: bolsa-estado-${{ github.run_id }}
