name: Precios de fondos

on:
  schedule:
    # Los fondos publican un valor liquidativo al día (normalmente por la tarde/noche o a la mañana
    # siguiente). Se mira cada 2 horas de lunes a sábado; solo hay commit si sale un precio nuevo.
    - cron: "19 6-22/2 * * 1-6"
  workflow_dispatch:

concurrency:
  group: fondos-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # guardar fondos/precios.json en main
      pages: write # pedir que se publique Pages
    defaults:
      run:
        working-directory: fondos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fondos/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q test_precios.py
      - name: Descargar precios
        run: python precios.py

      # La web (fondos/index.html) la publica GitHub Pages desde main: basta con guardar ahí los precios.
      - name: Publicar precios
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precios.json
          if git diff --cached --quiet; then echo "Sin precios nuevos"; exit 0; fi
          git commit -m "Precios de fondos: $(TZ=Europe/Madrid date '+%d/%m/%Y %H:%M')"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((intento * 5))
          done
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
