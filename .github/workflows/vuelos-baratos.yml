name: Vuelos baratos

on:
  schedule:
    # GitHub programa en UTC, no sigue el cambio de hora y a veces retrasa o se salta ejecuciones (sobre todo
    # a las horas en punto). Por eso hay un intento cada hora a los :47 y el job "hora" decide: solo se busca
    # a partir de las 06:45 de Madrid y si hoy aún no se ha mandado el mensaje. Así el primer intento cae a las
    # 06:47 de Madrid (verano: 4:47 UTC; invierno: 5:47 UTC) y los siguientes son de reserva.
    - cron: "47 4,5,6,7,8 * * *"
  workflow_dispatch:

concurrency:
  group: vuelos-baratos
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    permissions:
      actions: read # para ver si hoy ya hubo una ejecución que mandó el mensaje
    outputs:
      toca: ${{ steps.decidir.outputs.toca }}
    steps:
      - id: decidir
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          # Lanzado a mano: siempre.
          if [ "$EVENTO" != "schedule" ]; then echo "toca=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          ahora=$(TZ=Europe/Madrid date +%H%M)
          if [ "$ahora" -lt 0645 ]; then
            echo "toca=false" >> "$GITHUB_OUTPUT"; echo "Son las $ahora en Madrid: aún es pronto."; exit 0
          fi
          # ¿Alguna ejecución de hoy (hora de Madrid) llegó a mandar el mensaje (job "informe" correcto)?
          desde=$(date -u -d "$(TZ=Europe/Madrid date +%Y-%m-%d) 00:00 $(TZ=Europe/Madrid date +%z)" +%Y-%m-%dT%H:%M:%SZ)
          api="https://api.github.com/repos/${{ github.repository }}/actions"
          ids=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "$api/workflows/vuelos-baratos.yml/runs?created=%3E%3D$desde&per_page=50" \
            | jq -r --arg yo "${{ github.run_id }}" '.workflow_runs[] | select((.id|tostring) != $yo) | .id')
          for id in $ids; do
            if curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/runs/$id/jobs" \
                | jq -e '.jobs[] | select(.name == "informe" and .conclusion == "success")' > /dev/null; then
              echo "toca=false" >> "$GITHUB_OUTPUT"
              echo "Hoy ya se mandó el mensaje (ejecución $id); este intento de reserva no hace nada."
              exit 0
            fi
          done
          echo "toca=true" >> "$GITHUB_OUTPUT"
          echo "Son las $ahora en Madrid y hoy aún no se ha mandado el mensaje: se busca."

  # Los destinos se reparten en partes que se consultan a la vez (cada destino, en cada viaje, son 2 consultas
  # de billete de ida y vuelta por combinación de fechas: directo y con escala); luego "informe" junta y manda
  # un mensaje por viaje.
  buscar:
    needs: hora
    if: needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: vuelos-baratos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vuelos-baratos/requirements.txt
      - run: pip install -r requirements.txt
      - run: python vuelos_baratos.py --parte ${{ matrix.parte }} --de 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parte-${{ matrix.parte }}
          path: vuelos-baratos/parte_${{ matrix.parte }}.json
          retention-days: 7

  informe:
    needs: [hora, buscar]
    permissions:
      contents: write # guardar los datos del mapa en main
      pages: write # pedir que se publique Pages
    # Aunque falle alguna parte se manda el mensaje con el resto (y el aviso de lo que falta).
    if: always() && needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vuelos-baratos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para poder hacer rebase al guardar los datos del mapa
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vuelos-baratos/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          path: vuelos-baratos
          merge-multiple: true

      # Recupera el precio anterior de cada destino para marcar bajadas (📉) y novedades (🆕).
      - uses: actions/cache/restore@v4
        with:
          path: vuelos-baratos/historial.json
          key: vuelos-historial-${{ github.run_id }}
          restore-keys: vuelos-historial-

      - name: Mandar mensaje
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python vuelos_baratos.py --informe parte_*.json

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: vuelos-baratos/historial.json
          key: vuelos-historial-${{ github.run_id }}

      # El mapa (vuelos-baratos/mapa/) lo publica GitHub Pages desde la rama main: basta con guardar ahí los
      # datos nuevos. https://ammdg.github.io/APPs/vuelos-baratos/mapa/ (solo en las ejecuciones de main).
      - name: Publicar datos del mapa
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/datos.json
          if git diff --cached --quiet; then echo "Sin cambios en el mapa"; exit 0; fi
          git commit -m "Mapa de vuelos baratos: datos del $(TZ=Europe/Madrid date +%d/%m/%Y)"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((intento * 5))
          done
          # Los push hechos con el token de Actions no siempre lanzan la publicación de Pages: se pide a mano.
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
