name: Vuelos baratos

on:
  schedule:
    # GitHub programa en UTC y no sigue el cambio de hora, así que hay dos horarios y cada día
    # solo se ejecuta el que cae a las 07:00 de Madrid (ver el job "hora").
    - cron: "0 5 * * *" # 07:00 en Madrid con horario de verano (UTC+2)
    - cron: "0 6 * * *" # 07:00 en Madrid con horario de invierno (UTC+1)
  workflow_dispatch:

concurrency:
  group: vuelos-baratos
  cancel-in-progress: false

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.decidir.outputs.toca }}
    steps:
      - id: decidir
        env:
          HORARIO: ${{ github.event.schedule }}
        run: |
          # Lanzado a mano: siempre. Programado: solo el horario que corresponde al cambio de hora
          # vigente en Madrid (se mira qué cron lo lanzó, no la hora real, por si GitHub se retrasa).
          desfase=$(TZ=Europe/Madrid date +%z)
          if [ -z "$HORARIO" ] \
             || { [ "$HORARIO" = "0 5 * * *" ] && [ "$desfase" = "+0200" ]; } \
             || { [ "$HORARIO" = "0 6 * * *" ] && [ "$desfase" = "+0100" ]; }; then
            echo "toca=true" >> "$GITHUB_OUTPUT"
          else
            echo "toca=false" >> "$GITHUB_OUTPUT"
            echo "Horario '$HORARIO' no corresponde a las 07:00 de Madrid (desfase $desfase); se omite."
          fi

  # Los destinos se reparten en partes que se consultan a la vez (cada destino son 8 consultas de billete de
  # ida y vuelta: 4 combinaciones de fechas, directo y con escala); luego "informe" junta y manda el mensaje.
  buscar:
    needs: hora
    if: needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: vuelos-baratos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vuelos-baratos/requirements.txt
      - run: pip install -r requirements.txt
      - run: python vuelos_baratos.py --parte ${{ matrix.parte }} --de 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parte-${{ matrix.parte }}
          path: vuelos-baratos/parte_${{ matrix.parte }}.json
          retention-days: 7

  informe:
    needs: [hora, buscar]
    permissions:
      contents: write # guardar los datos del mapa en main
      pages: write # pedir que se publique Pages
    # Aunque falle alguna parte se manda el mensaje con el resto (y el aviso de lo que falta).
    if: always() && needs.hora.outputs.toca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vuelos-baratos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para poder hacer rebase al guardar los datos del mapa
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vuelos-baratos/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          path: vuelos-baratos
          merge-multiple: true

      # Recupera el precio anterior de cada destino para marcar bajadas (📉) y novedades (🆕).
      - uses: actions/cache/restore@v4
        with:
          path: vuelos-baratos/historial.json
          key: vuelos-historial-${{ github.run_id }}
          restore-keys: vuelos-historial-

      - name: Mandar mensaje
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python vuelos_baratos.py --informe parte_*.json

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: vuelos-baratos/historial.json
          key: vuelos-historial-${{ github.run_id }}

      # El mapa (vuelos-baratos/mapa/) lo publica GitHub Pages desde la rama main: basta con guardar ahí los
      # datos nuevos. https://ammdg.github.io/APPs/vuelos-baratos/mapa/ (solo en las ejecuciones de main).
      - name: Publicar datos del mapa
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa/datos.json
          if git diff --cached --quiet; then echo "Sin cambios en el mapa"; exit 0; fi
          git commit -m "Mapa de vuelos baratos: datos del $(TZ=Europe/Madrid date +%d/%m/%Y)"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep $((intento * 5))
          done
          # Los push hechos con el token de Actions no siempre lanzan la publicación de Pages: se pide a mano.
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
