name: Generar lista de acciones (bolsa)

# Genera alertas-bolsa/universo_fijo.json: las 500 acciones de mayor capitalización de EE. UU. al
# cierre de una fecha. Solo se ejecuta a mano (o al cambiar universo.py en la rama de desarrollo),
# porque la lista es fija y no se recalcula cada día.
on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha de cierre AAAA-MM-DD (vacío = última sesión cerrada)"
        default: ""
      solo_eeuu:
        description: "Excluir empresas extranjeras (ADR)"
        type: boolean
        default: false
  push:
    branches: [claude/stock-market-alerts-ex6jzw]
    paths: [alertas-bolsa/universo.py, .github/workflows/generar-universo-bolsa.yml]

permissions:
  contents: write # guardar universo_fijo.json en la rama

concurrency:
  group: generar-universo-bolsa
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: alertas-bolsa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alertas-bolsa/requirements.txt

      - run: pip install -r requirements.txt

      - name: Generar la lista
        env:
          # Al hacer push en la rama de desarrollo: cierre del viernes 25/09/2026 (lista de partida).
          FECHA: ${{ github.event_name == 'push' && '2026-09-25' || inputs.fecha }}
          SOLO_EEUU: ${{ inputs.solo_eeuu && '--solo-eeuu' || '' }}
        run: python universo.py ${FECHA:+--fecha "$FECHA"} $SOLO_EEUU

      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universo_fijo.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Alertas de bolsa: lista de las 500 mayores al cierre del $(python -c 'import json;print(json.load(open("universo_fijo.json"))["fecha_referencia"])')"
          for intento in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((intento * 5))
          done
